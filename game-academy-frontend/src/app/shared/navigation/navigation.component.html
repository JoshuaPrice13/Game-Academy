<div class="app-layout">
  <!-- Top Navigation Bar -->
  <header class="top-nav">
    <div class="nav-left">
      <button class="menu-toggle" (click)="toggleSidebar()">
        <span class="hamburger-icon">☰</span>
      </button>
      <div class="logo">
        <span class="logo-icon">🎓</span>
        <span class="logo-text">Game Academy</span>
      </div>
    </div>

    <div class="nav-right">
      <!-- Notifications -->
      <button class="icon-button notification-button">
        <span class="icon">🔔</span>
        <span class="badge">3</span>
      </button>

      <!-- User Menu -->
      <div class="user-menu-container">
        <button class="user-menu-button" (click)="toggleUserMenu()">
          <div class="user-avatar">
            {{ currentUser?.username?.charAt(0).toUpperCase() }}
          </div>
          <div class="user-info">
            <span class="user-name">{{ currentUser?.username }}</span>
            <span class="user-role" [class]="getRoleBadgeClass()">
              {{ getRoleDisplayName() }}
            </span>
          </div>
          <span class="dropdown-arrow">▼</span>
        </button>

        <!-- Dropdown Menu -->
        <div class="user-dropdown" *ngIf="showUserMenu" (click)="closeUserMenu()">
          <div class="dropdown-header">
            <div class="dropdown-user-info">
              <strong>{{ currentUser?.username }}</strong>
              <small>{{ currentUser?.email }}</small>
            </div>
          </div>
          <div class="dropdown-divider"></div>
          <a [routerLink]="currentUser?.role === 'TEACHER' ? '/teacher/profile' : '/student/profile'" class="dropdown-item">
            <span class="item-icon">👤</span>
            <span>My Profile</span>
          </a>
          <a href="#" class="dropdown-item">
            <span class="item-icon">⚙️</span>
            <span>Settings</span>
          </a>
          <a href="#" class="dropdown-item">
            <span class="item-icon">❓</span>
            <span>Help & Support</span>
          </a>
          <div class="dropdown-divider"></div>
          <button class="dropdown-item logout-item" (click)="logout()">
            <span class="item-icon">🚪</span>
            <span>Logout</span>
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- Sidebar Navigation -->
  <aside class="sidebar" [class.collapsed]="isSidebarCollapsed">
    <nav class="sidebar-nav">
      <a
        *ngFor="let link of getFilteredNavLinks()"
        [routerLink]="link.path"
        routerLinkActive="active"
        class="nav-link">
        <span class="nav-icon">{{ link.icon }}</span>
        <span class="nav-label" *ngIf="!isSidebarCollapsed">{{ link.label }}</span>
      </a>
    </nav>

    <!-- Collapse Toggle at Bottom -->
    <div class="sidebar-footer">
      <button class="collapse-toggle" (click)="toggleSidebar()">
        <span *ngIf="!isSidebarCollapsed">◀</span>
        <span *ngIf="isSidebarCollapsed">▶</span>
      </button>
    </div>
  </aside>

  <!-- Main Content Area -->
  <main class="main-content">
    <ng-content></ng-content>
  </main>
</div>

<!-- Overlay for mobile menu -->
<div class="overlay" *ngIf="!isSidebarCollapsed" (click)="toggleSidebar()"></div>
